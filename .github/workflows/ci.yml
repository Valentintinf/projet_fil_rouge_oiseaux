# Intégration et livraison continues du projet « Oiseaux de Gironde »
#  1. qualite   : mêmes contrôles que pre-commit (lint Python/SQL, secrets, fichiers)
#  2. tests     : pytest et dbt build sur une base PostgreSQL éphémère
#  3. livraison : construit l'image Docker et la publie sur ghcr.io (branche main uniquement)
# Les étapes dont le code n'existe pas encore (tests/, dbt, Dockerfile) sont ignorées.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint et contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Installer pre-commit
        run: pip install pre-commit

      - name: Lancer tous les contrôles
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests et dbt
    runs-on: ubuntu-latest
    needs: qualite
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # pragma: allowlist secret
          POSTGRES_DB: oiseaux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci
      PGPASSWORD: ci # pragma: allowlist secret
      PGDATABASE: oiseaux_test
      DBT_PROFILES_DIR: ${{ github.workspace }}/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Tests unitaires (pytest)
        run: |
          if [ ! -d tests ]; then
            echo "Pas encore de dossier tests/ : étape ignorée."
            exit 0
          fi
          pip install pytest
          pytest -v

      - name: Construire et tester les modèles dbt
        run: |
          projet=$(find . -name dbt_project.yml -not -path "*/dbt_packages/*" | head -n 1)
          if [ -z "$projet" ]; then
            echo "Pas encore de projet dbt : étape ignorée."
            exit 0
          fi
          pip install dbt-postgres
          cd "$(dirname "$projet")"
          dbt deps
          dbt build

  livraison:
    name: Image Docker (ghcr.io)
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Chercher un Dockerfile
        id: docker
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas encore de Dockerfile : livraison ignorée."
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.docker.outputs.present == 'true'

      - uses: docker/login-action@v4
        if: steps.docker.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags de l'image
        id: meta
        if: steps.docker.outputs.present == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        if: steps.docker.outputs.present == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
